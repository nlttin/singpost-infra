name: Standard CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # PARALLEL STAGE 1: FAST CHECKS
  # ==========================================
  gitleaks-scan:
    uses: nlttin/singpost-cicd-components/.github/workflows/reusable-workflow-gitleaks.yml@dev
    with:
      scan_mode: full
      fail-on-detection: false
    secrets: inherit

  checkov-scan:
    uses: nlttin/singpost-cicd-components/.github/workflows/reusable-workflow-checkov.yml@feature/checkov
    with:
      config-path: ./.github/config/checkov.yml
    secrets: inherit

  # ==========================================
  # STAGE 2: SECURITY GATE
  # ==========================================
  security-scans:
    needs: [gitleaks-scan, checkov-scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Security scans completed"

  # ==========================================
  # STAGE 3: DEPLOYMENTS
  # ==========================================
  deploy-dev:
    needs: security-scans
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mocking Terraform DEV"
      - run: echo "Mocking Apigee DEV"
      - run: echo "Mocking Cloud Deploy GKE DEV"

  deploy-prod:
    needs: security-scans
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mocking Terraform PROD"
      - run: echo "Mocking Apigee PROD"
      - run: echo "Mocking Cloud Deploy GKE PROD"

  # ==========================================
  # STAGE 4: NOTIFY
  # ==========================================
  notify:
    if: always()
    needs: [deploy-dev, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mocking GChat Webhook"
