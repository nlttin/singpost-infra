            --org ${{ secrets.GCP_PROJECT }} \
            --token "$TOKEN" \
            --ovr --wait

  # ==========================================
  # STAGE 3: DEPLOY PROD
  # ==========================================
  deploy-prod:
    needs: security-scans
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TG_DIR: live/prod/gcp
      APIGEE_ENV: sp-logistic-apigee-env-prod
      APIGEE_PROXY: sp-logistic-prod-cloudrun-proxy
      CLOUD_RUN_SERVICE: sp-logistic-prod-cloudrun-app
