          apigeecli apis deploy \
            --name "${{ env.APIGEE_PROXY }}" \
            --env "${{ env.APIGEE_ENV }}" \
            --org ${{ secrets.GCP_PROJECT }} \
            --token "$TOKEN" \
            --ovr --wait

  # ==========================================
  # STAGE 3: DEPLOY PREPROD
  # ==========================================
  deploy-preprod:
    needs: security-scans
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preprod'
    runs-on: ubuntu-latest
    environment: preprod
    permissions:
      contents: read
      id-token: write
    env:
      TG_DIR: live/preprod/gcp
      APIGEE_ENV: sp-logistic-apigee-env-preprod
      APIGEE_PROXY: sp-logistic-preprod-cloudrun-proxy
      CLOUD_RUN_SERVICE: sp-logistic-preprod-cloudrun-app
      REGION: asia-southeast1
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
