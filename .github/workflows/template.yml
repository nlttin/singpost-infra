name: Standard CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - sit
          - uat
          - preprod
          - prod

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TF_VERSION: "1.14.0"
  TG_VERSION: "0.77.3"

jobs:
  # ==========================================
  # PARALLEL STAGE 1: FAST CHECKS
  # ==========================================
  checkout-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  gitleaks-scan:
    needs: checkout-code
    uses: SINGAPORE-POST-LIMITED/singpost-cicd-components/.github/workflows/reusable-workflow-gitleaks.yml@dev
    with:
      scan_mode: full
      fail-on-detection: false
    secrets: inherit

  checkov-scan:
    needs: checkout-code
    uses: SINGAPORE-POST-LIMITED/singpost-cicd-components/.github/workflows/reusable-workflow-checkov.yml@feature/checkov
    with:
      config-path: ./.github/config/checkov.yml
    secrets: inherit

  # ==========================================
  # STAGE 2: SECURITY SCANS
  # ==========================================
  security-scans:
    needs: [gitleaks-scan, checkov-scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mocking CodeQL & SonarQube"

  # ==========================================
  # STAGE 3: DEPLOY DEV
  # ==========================================
  deploy-dev:
    needs: security-scans
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      TG_DIR: live/dev/gcp
      APIGEE_ENV: sp-logistic-apigee-env-dev
      APIGEE_PROXY: sp-logistic-dev-cloudrun-proxy
      CLOUD_RUN_SERVICE: sp-logistic-dev-cloudrun-app
      REGION: asia-southeast1
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Apply DEV
        run: |
          cd ${{ env.TG_DIR }}
          terragrunt run-all apply --terragrunt-non-interactive
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
          TF_INPUT: "false"

      - name: Get Cloud Run URL
        id: cloud_run
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT }} \
            --format 'value(status.url)')
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Package Apigee proxy bundle
        run: |
          sed "s|CLOUD_RUN_URL_PLACEHOLDER|${{ steps.cloud_run.outputs.url }}|g" \
            apigee/apiproxy/targets/default.xml > /tmp/default.xml
          cp /tmp/default.xml apigee/apiproxy/targets/default.xml
          cd apigee && zip -r ../apiproxy.zip apiproxy/

      - name: Install apigeecli
        run: |
          curl -L https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh | sh
          echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

      - name: Deploy Apigee proxy DEV
        run: |
          TOKEN=$(gcloud auth print-access-token)
          apigeecli apis create bundle \
            --name "${{ env.APIGEE_PROXY }}" \
            --proxy-zip apiproxy.zip \
            --org ${{ secrets.GCP_PROJECT }} \
            --token "$TOKEN"
          apigeecli apis deploy \
            --name "${{ env.APIGEE_PROXY }}" \
            --env "${{ env.APIGEE_ENV }}" \
            --org ${{ secrets.GCP_PROJECT }} \
            --token "$TOKEN" \
            --ovr --wait

  # ==========================================
  # STAGE 3: DEPLOY SIT
  # ==========================================
  deploy-sit:
    needs: security-scans
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'sit'
    runs-on: ubuntu-latest
    environment: sit
    permissions:
      contents: read
      id-token: write
    env:
      TG_DIR: live/sit/gcp
      APIGEE_ENV: sp-logistic-apigee-env-sit
      APIGEE_PROXY: sp-logistic-sit-cloudrun-proxy
      CLOUD_RUN_SERVICE: sp-logistic-sit-cloudrun-app
      REGION: asia-southeast1
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
