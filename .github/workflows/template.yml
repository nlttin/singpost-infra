            --org ${{ secrets.GCP_PROJECT }} \
            --token "$TOKEN" \
            --ovr --wait

  # ==========================================
  # STAGE 4: NOTIFY
  # ==========================================
  notify:
    if: always()
    needs: [deploy-dev, deploy-sit, deploy-uat, deploy-preprod, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mocking GChat Webhook"
